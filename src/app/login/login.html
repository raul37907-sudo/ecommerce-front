<div class="login-container">
  <div class="login-card">

    <!-- Encabezado del Formulario -->
    <div class="login-header">
      <div class="logo-circle">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2>Bienvenido de nuevo</h2>
      <p>Ingresa tus credenciales para acceder a la plataforma</p>
    </div>

    <!-- Formulario vinculado a login() -->
    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>

      <!-- Alerta global si las credenciales fallan -->
      <div class="error-banner" *ngIf="!loginValid">
        Correo o contraseña incorrectos. Verifica tus datos.
      </div>

      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope icon-left"></i>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="user.email"
            placeholder="ejemplo@correo.com"
            required
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-lock icon-left"></i>
          <input
            id="password"
            [type]="hidePassword ? 'password' : 'text'"
            name="password"
            [(ngModel)]="user.password"
            placeholder="••••••••"
            required
          />
          <!-- Botón Ojo (Mostrar / Ocultar) -->
          <button
            type="button"
            class="toggle-password"
            (click)="hidePassword = !hidePassword"
            tabindex="-1"
            aria-label="Mostrar u ocultar contraseña">
            <i [class]="hidePassword ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill'"></i>
          </button>
        </div>
      </div>

      <!-- Opciones adicionales -->
      <div class="form-actions-row">
        <label class="checkbox-container">
          <input type="checkbox" name="rememberMe" />
          Recordarme
        </label>
        <a href="#" class="forgot-password" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón de Iniciar Sesión -->
      <button type="submit" class="btn-submit" [disabled]="!loginForm.form.valid">
        Iniciar Sesión
      </button>

    </form>

  </div>
</div>
