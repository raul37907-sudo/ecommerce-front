<div class="container mt-5" style="max-width: 450px;">
  <div class="card shadow-sm p-4">
    <h3 class="card-title text-center mb-3">Restablecer Contraseña</h3>

    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="mb-3">
        <label for="password" class="form-label">Nueva Contraseña</label>
        <input
          type="password"
          id="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="resetForm.get('password')?.touched && resetForm.get('password')?.invalid"
        />
        <div class="invalid-feedback">
          La contraseña debe tener al menos 8 caracteres.
        </div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          class="form-control"
          formControlName="confirmPassword"
          [class.is-invalid]="resetForm.get('confirmPassword')?.touched && (resetForm.get('confirmPassword')?.invalid || resetForm.hasError('passwordMismatch'))"
        />
        <div class="invalid-feedback" *ngIf="resetForm.hasError('passwordMismatch')">
          Las contraseñas no coinciden.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading || !token">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Restablecer
      </button>
    </form>
  </div>
</div>
