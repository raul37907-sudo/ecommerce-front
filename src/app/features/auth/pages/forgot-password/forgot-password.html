<div class="container mt-5" style="max-width: 450px;">
  <div class="card shadow-sm p-4">
    <h3 class="card-title text-center mb-3">¿Olvidaste tu contraseña?</h3>
    <p class="text-muted text-center small mb-4">
      Ingresa tu correo registrado y te enviaremos las instrucciones para restablecerla.
    </p>

    <!-- Alertas -->
    <div *ngIf="successMessage" class="alert alert-success mt-2">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger mt-2">{{ errorMessage }}</div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
          placeholder="ejemplo@correo.com"
        />
        <div class="invalid-feedback" *ngIf="forgotForm.get('email')?.hasError('required')">
          El correo es obligatorio.
        </div>
        <div class="invalid-feedback" *ngIf="forgotForm.get('email')?.hasError('email')">
          Ingresa un correo electrónico válido.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Enviar enlace
      </button>
    </form>
  </div>
</div>
